<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f3c948"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b43a"/>
      <stop offset="1" stop-color="#d4a62d"/>
    </linearGradient>
  </defs>

  <!-- sticky note body with a folded bottom-right corner -->
  <path d="M50 26
           H182
           a26 26 0 0 1 26 26
           V168
           L168 208
           H76
           a26 26 0 0 1 -26 -26
           V52
           a26 26 0 0 1 26 -26 Z"
        fill="url(#note)"/>

  <!-- the folded corner flap -->
  <path d="M168 208 V182 a14 14 0 0 1 14 -14 H208 Z" fill="url(#fold)"/>

  <!-- glance check mark -->
  <path d="M84 120 l26 28 l50 -58"
        fill="none" stroke="#3a3320" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
